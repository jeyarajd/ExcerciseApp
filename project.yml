# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: FloorAge
options:
  bundleIdPrefix: com.jeyaraj
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # English is the default language; Hindi and Spanish come from the String Catalogs in Resources.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FloorAge:
    type: application
    platform: iOS
    sources:
      - path: FloorAge
    info:
      path: FloorAge/Info.plist
      properties:
        CFBundleDisplayName: Floor Age
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: Floor Age counts your daily steps on this iPhone. Your steps never leave your phone.
        NSCameraUsageDescription: Point the camera at your meal for calorie suggestions, or let it follow your movements to score the Floor Age check. Everything is checked on your iPhone and never saved or sent.
        LSApplicationQueriesSchemes: [music, spotify, youtubemusic, jiosaavn, gaana]
        NSHealthShareUsageDescription: Floor Age reads your sleep from Apple Health to show how long you sleep. It never changes your Health data or sends it anywhere.
    entitlements:
      path: FloorAge/FloorAge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeyaraj.floorage
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  FloorAgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FloorAgeTests
    dependencies:
      - target: FloorAge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jeyaraj.floorage.tests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FloorAge:
    build:
      targets:
        FloorAge: all
        FloorAgeTests: [test]
    run:
      config: Debug
      # Test the Floor Age Plus purchase in Xcode without the App Store or real money.
      storeKitConfiguration: FloorAge.storekit
    test:
      config: Debug
      targets:
        - FloorAgeTests
    archive:
      config: Release
